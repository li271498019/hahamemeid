# nginx snippet for the haha.meme MCP server.
# Include inside the https://haha.meme server block.
# The MCP server (systemd haha-mcp) listens on 127.0.0.1:3333.
# Rate limit: burst 20, same shape as the sign-verify endpoint.

limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

location /mcp {
    limit_req zone=mcp burst=20 nodelay;
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streamable HTTP uses long-lived SSE responses; do not buffer them.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
