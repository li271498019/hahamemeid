<script>
(function () {
  function T(key) { return HahaI18n.t(key); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  /* agentURI 只认 http(s) 链接：其他 scheme（如 javascript:）只渲染纯文本，防存储型 XSS。 */
  function uriLink(uri) { var u = String(uri == null ? "" : uri).trim(); if (/^https?:\/\//i.test(u)) return '<a href="' + esc(u) + '">' + esc(u) + '</a>'; return esc(u); }
  function stars(n) { var s = ""; for (var i = 1; i <= 5; i++) s += i <= n ? "★" : "☆"; return s; }
  function isZero(addr) { return !addr || /^0x0{40}$/.test(addr); }
  function scoreText(count, sum) {
    count = Number(count || 0);
    sum = Number(sum || 0);
    if (!count) return T("erc.noScore");
    var avg = sum / count;
    return stars(Math.round(avg)) + " " + (Math.round(avg * 10) / 10) + " · " + HahaI18n.fill("erc.reviewCount", { n: count });
  }
  function when(value) {
    var formatted = HahaI18n.formatTime(value);
    return formatted ? esc(formatted) : "";
  }
  function reviewRow(r) {
    var edited = r.edited ? " · " + esc(T("agent.edited")) : "";
    var parts = [];
    if (r.raterName) parts.push(r.raterName);
    if (r.raterAi) parts.push(r.raterAi);
    var raterText = parts.length ? parts.join(" · ") : (r.rater || "");
    return '<div class="review"><div class="stars">' + stars(r.stars) + '</div><div class="review-text">' + esc(r.review) + '</div><div class="review-rater">' + esc(raterText) + '</div>' + (r.ratedAt ? '<div class="review-time">' + when(r.ratedAt) + edited + '</div>' : "") + '</div>';
  }
  /* 把 EVM 地址换成它的 .ai（有 .ai 时），无 .ai 时照常显示 EVM 地址。 */
  async function displayName(address) {
    if (!address) return "";
    if (window.HahaRPC && typeof HahaRPC.aiName === "function") {
      try { var ai = await Promise.resolve(HahaRPC.aiName(address)); if (ai) return ai; } catch (err) {}
    }
    return address;
  }

  // ?name= 取名字，默认 moon.haha 仅作输入缺省，不把它当成已铸造事实。
  var raw = new URLSearchParams(location.search).get("name") || "moon.haha";
  var parts = raw.split(".");
  var label = (parts[0] || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  var tld = (parts[1] === "meme") ? "meme" : "haha";
  var name = label + "." + tld;
  var root = document.getElementById("root");

  function notFound(msg) {
    root.innerHTML = '<h1>' + esc(T("agent.missing")) + '</h1><p class="lede">' + esc(msg) + '</p>';
  }

  /* 从评价文本库随机取一条当默认评语（避免连续两次相同）。
   * 库未加载时返回空串，评价框留空、用户自己写。 */
  var lastReview = "";
  function randomReview() {
    var lib = window.HAHA_REVIEW_LIBRARY;
    if (!lib || !lib.length) return "";
    var pick = lib[Math.floor(Math.random() * lib.length)];
    if (lib.length > 1) {
      var guard = 0;
      while (pick === lastReview && guard < 10) {
        pick = lib[Math.floor(Math.random() * lib.length)];
        guard++;
      }
    }
    lastReview = pick;
    return pick;
  }

  // 历代：HahaIndex.generations(fullName)。代数从大到小、当前代在前，评语按 ratedAt 倒序；
  // 从未铸出返回 null，铸出过但无 agent 时 generations 为 []。没有数据时显示空状态。
  async function loadGenerations(generation) {
    var genBox = document.getElementById("generations");
    var revBox = document.getElementById("agent-reviews");
    if (!genBox && !revBox) return;
    if (!window.HahaIndex || typeof HahaIndex.generations !== "function") {
      if (genBox) genBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      if (revBox) revBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      return;
    }
    var res;
    try { res = await Promise.resolve(HahaIndex.generations(name)); } catch (err) {
      if (genBox) genBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      if (revBox) revBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      return;
    }
    if (!res || !res.generations || !res.generations.length) {
      if (genBox) genBox.innerHTML = "<p>" + esc(T("agent.noGen")) + "</p>";
      if (revBox) revBox.innerHTML = "<p>" + esc(T("agent.noRev")) + "</p>";
      return;
    }
    var gens = res.generations;
    if (revBox) {
      var current = gens.filter(function (g) { return g.active; })[0] || gens.filter(function (g) { return Number(g.generation) === Number(generation); })[0] || gens[0];
      var reviews = current.reviews || [];
      revBox.innerHTML = reviews.length
        ? reviews.map(reviewRow).join("")
        : "<p>" + esc(T("agent.noRev")) + "</p>";
    }
    if (genBox) {
      var owners = await Promise.all(gens.map(function (gen) { return displayName(gen.owner); }));
      genBox.innerHTML = gens.map(function (gen, i) {
        var reviews = (gen.reviews || []).map(reviewRow).join("");
        return '<article class="card"><h3>' + esc(HahaI18n.fill("erc.genN", { n: gen.generation })) + (gen.active ? " · " + esc(T("erc.current")) : "") + '</h3>'
          + '<p>' + scoreText(gen.starsCount, gen.starsSum) + '</p>'
          + '<p>agentId ' + esc(gen.agentId) + ' · ' + esc(T("agent.holder")) + esc(owners[i]) + '</p>'
          + (gen.agentURI ? '<p>agentURI：' + uriLink(gen.agentURI) + '</p>' : '')
          + (gen.activatedAt ? '<p>' + esc(T("agent.activated")) + when(gen.activatedAt) + '</p>' : '')
          + (gen.resetAt ? '<p>' + esc(T("agent.ended")) + when(gen.resetAt) + '</p>' : '')
          + (reviews || "<p>" + esc(T("agent.noRev")) + "</p>")
          + (gen.reviewsTruncated ? "<p>" + esc(T("erc.truncated")) + "</p>" : "")
          + '</article>';
      }).join("");
    }
  }

  var cached = null;
  async function load() {
    if (!window.HahaRPC) { notFound(T("agent.chain")); return; }
    var tokenId, owner, agentId, agent, score;
    try {
      if (cached) {
        tokenId = cached.tokenId; owner = cached.owner; agentId = cached.agentId; agent = cached.agent; score = cached.score;
      } else {
        tokenId = HahaRPC.tokenIdOf ? HahaRPC.tokenIdOf(label, tld) : await Promise.resolve(HahaRPC.nodeOf(label, tld));
        if (!tokenId) { notFound(T("agent.notFound")); return; }
        var first = await Promise.all([HahaRPC.ownerOf(tokenId), HahaRPC.agentOfName(tokenId)]);
        owner = first[0];
        agentId = first[1];
        if (isZero(owner) || !agentId || String(agentId) === "0") { notFound(T("agent.notFound")); return; }
        var second = await Promise.all([HahaRPC.getAgent(agentId), HahaRPC.getScore(agentId)]);
        agent = second[0];
        score = second[1];
        if (!agent || !agent.active) { notFound(T("agent.notFound")); return; }
        cached = { tokenId: tokenId, owner: owner, agentId: agentId, agent: agent, score: score };
      }
    } catch (err) { notFound(T("agent.chain")); return; }

    var generation = agent.generation != null ? agent.generation : "";
    var holderText = await displayName(owner);
    var uri = agent.uri || "";
    var uriHtml = uri ? '<p>agentURI：' + uriLink(uri) + '</p>' : "";
    var nft = (typeof hahaNft === "function") ? hahaNft(name) : "";
    var commentValue = "";
    var oldComment = document.getElementById("comment");
    var hadComment = !!oldComment;
    if (oldComment) commentValue = oldComment.value;
    root.innerHTML = '<p class="kicker">' + esc(T("agent.kicker")) + '</p><div class="two">'
      + '<div class="panel"><div class="nft" style="max-width:280px">' + nft + '</div><h2>' + esc(name) + '</h2><p>' + esc(T("agent.active")) + '</p><p>' + esc(T("agent.holder")) + esc(holderText) + '</p><p>' + esc(HahaI18n.fill("agent.gen", { n: generation })) + '</p><p class="stars">' + scoreText(score && score.count, score && score.sum) + '</p>' + uriHtml + '<p><a class="btn light" href="/erc8004.html">' + esc(T("agent.back")) + '</a></p></div>'
      + '<div class="panel"><h2>' + esc(T("agent.write")) + '</h2><p>' + esc(T("agent.writeHelp")) + '</p>'
      + '<form id="rate" class="list"><label>' + esc(T("agent.stars")) + ' <select id="stars" class="field-input"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>'
      + '<textarea id="comment" class="field-input" maxlength="140" placeholder="' + esc(T("agent.commentPh")) + '" rows="3"></textarea>'
      + '<div><button class="btn light" type="button" id="random-review">' + esc(T("agent.randomReview")) + '</button></div>'
      + '<button class="btn" type="submit">' + esc(T("agent.copy")) + '</button></form>'
      + '<h2>' + esc(T("agent.reviews")) + '</h2><div class="list" id="agent-reviews"><p>' + esc(T("agent.loadingRev")) + '</p></div>'
      + '<h2>' + esc(T("agent.gens")) + '</h2><p>' + esc(HahaI18n.fill("agent.genHelp", { n: generation })) + '</p><p>' + esc(T("agent.oldFromIndex")) + '</p><div class="list" id="generations"><p>' + esc(T("agent.loadingGen")) + '</p></div>'
      + '</div></div>';
    var commentEl = document.getElementById("comment");
    if (commentValue) commentEl.value = commentValue;
    else if (!hadComment) commentEl.value = randomReview();
    var randomBtn = document.getElementById("random-review");
    if (randomBtn) randomBtn.addEventListener("click", function () {
      var el = document.getElementById("comment");
      if (el) el.value = randomReview();
    });

    document.getElementById("rate").addEventListener("submit", function (e) {
      e.preventDefault();
      var text = document.getElementById("comment").value.replace(/\r?\n/g, " ").trim() || T("agent.defaultComment");
      if (new TextEncoder().encode(text).length > 140) { HahaUI.toast(T("toast.reviewLong")); return; }
      var n = document.getElementById("stars").value;
      HahaUI.copyText(hahaInstruction(HahaI18n.task("rate", { name: name, stars: n, text: text }))).then(function (ok) {
        if (ok === false) return;
        HahaUI.toast(T("toast.rateCopied"));
      });
    });

    loadGenerations(generation);
  }
  if (window.HahaI18n) HahaI18n.onChange(function () { load(); });
  load();
})();
</script>
