# /etc/nginx/conf.d/haha-rpc.conf -- no secrets. Included by nginx.conf in the http context.
# /rpc/ order: ankr (one of two keys, 50/50) -> the other ankr key -> official BSC dataseed.

include /etc/nginx/haha-rpc-secrets.conf;    # upstream haha_rpc_ankr + the three ankr maps (server only)

upstream haha_rpc_bsc {
    server bsc-dataseed.binance.org:443 max_fails=0;
    keepalive 8;
    keepalive_timeout 30s;
}
map $server_name $haha_bsc_host { default "bsc-dataseed.binance.org"; }
map $server_name $haha_bsc_path { default "/"; }

# Spread the first try over the two keys so each key sees half the traffic.
split_clients "${request_id}" $haha_rpc_swap { 50% "1"; * "0"; }
map $haha_rpc_swap $haha_rpc_path_a { default $haha_ankr1_path; "1" $haha_ankr2_path; }
map $haha_rpc_swap $haha_rpc_path_b { default $haha_ankr2_path; "1" $haha_ankr1_path; }

# Which stage answered. $upstream_status lists every stage tried, e.g. "429, 200".
log_format haha_rpc '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time up=$upstream_status t=$upstream_response_time via=$sent_http_x_rpc_upstream';
