# haha.meme per-IP rate limiting (anti-abuse, generous for normal browsing).
# Zones are defined here (http context); limit_req is applied per-location
# in the haha.meme site config. Normal use: a page load bursts ~10-20 API
# calls, then idles (stats refreshes 2/min). Sustained floods get HTTP 429.
# 2026-11-24 (C, H6/I8): /api/ 60r/m -> 120r/m (scan page alone bursts past
# 60; 2026-11-24 saw 59 real-user 429s); sign-verify split into its own
# zone so scan browsing can't starve daily verification and vice versa;
# zones 10m -> 32m so a large distributed attack can't fill the state
# table and fail open; static assets get their own loose 300r/m zone.
limit_req_zone $binary_remote_addr zone=haha_api:32m rate=120r/m;
limit_req_zone $binary_remote_addr zone=haha_rpc:32m rate=120r/m;
limit_req_zone $binary_remote_addr zone=sign_verify:32m rate=30r/m;
limit_req_zone $binary_remote_addr zone=static:10m rate=300r/m;

# H7 (2026-11-24, C): per-IP connection cap (Slowloris / slow POST).
# Applied per-location in the site config (API/RPC 10-20, static looser).
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_zone $binary_remote_addr zone=mcp:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=agentchat:10m rate=120r/m;
