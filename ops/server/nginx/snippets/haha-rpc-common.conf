# /etc/nginx/snippets/haha-rpc-common.conf -- shared by /rpc/ and the named failover locations.
# (A named location is a separate location: it does not inherit the body cap or headers.)
client_max_body_size 32k;
add_header Retry-After 60 always;
include /etc/nginx/snippets/security-headers-haha.conf;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Origin "";          # never forward the browser's Origin / Referer to a provider
proxy_set_header Referer "";
recursive_error_pages on;            # REQUIRED: lets stage 1 -> 2 -> 3 chain several error_page redirects (default off = only one hop)
proxy_next_upstream error timeout;   # Ankr host has an IPv6 address and this server has no IPv6 route: the v6 peer fails instantly, retry the v4 peer
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 4s;     # HTTP-level failover to the next provider is still done by error_page
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
