# haha.meme security response headers (H10/M7, 2026-11-24, C).
# Included in the 443 server block AND in every location that sets its own
# add_header (nginx inheritance: any add_header in a location disables
# inheritance from the server block, so the set must be repeated there).
# CSP notes:
# - script-src keeps 'unsafe-inline': 8 HTML pages use inline <script>
#   blocks (index, market, agent, earn, erc8004, games, tasks,
#   season-checklist). script-src 'self' alone would break the site.
# - connect-src lists the 3 public BSC nodes js/rpc.js fastUrls() races
#   directly from the browser; default-src 'self' alone would block them.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://bsc-dataseed.binance.org https://bsc-dataseed1.defibit.io https://bsc-rpc.publicnode.com; frame-ancestors 'self'" always;
