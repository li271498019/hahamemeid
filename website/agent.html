<script>
(function () {
  function T(key) { return HahaI18n.t(key); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  /* agentURI 只认 http(s) 链接：其他 scheme（如 javascript:）只渲染纯文本，防存储型 XSS。 */
  function uriLink(uri) { var u = String(uri == null ? "" : uri).trim(); if (/^https?:\/\//i.test(u)) return '<a href="' + esc(u) + '">' + esc(u) + '</a>'; return esc(u); }
  function shortHash(h) { var s = String(h == null ? "" : h); if (s.length <= 16) return s; return s.slice(0, 8) + "…" + s.slice(-6); }
  function txLink(h) { if (!h) return ""; return '<a href="https://bscscan.com/tx/' + esc(h) + '" target="_blank" rel="noopener noreferrer" title="' + esc(h) + '">' + esc(shortHash(h)) + "</a>"; }
  /* 标准注册文件 URL（名字版）：与 erc8004.html 的激活默认 agentURI 同一地址。 */
  function registrationUrl(nm) {
    var origin = "https://haha.meme";
    try {
      if (location.origin && location.origin.indexOf("http") === 0) origin = location.origin;
    } catch (err) {}
    return origin + "/api/v1/agents/by-name/" + encodeURIComponent(nm) + "/registration.json";
  }
  function stars(n) { var s = ""; for (var i = 1; i <= 5; i++) s += i <= n ? "★" : "☆"; return s; }
  function isZero(addr) { return !addr || /^0x0{40}$/.test(addr); }
  function scoreText(count, sum) {
    count = Number(count || 0);
    sum = Number(sum || 0);
    if (!count) return T("erc.noScore");
    var avg = sum / count;
    return stars(Math.round(avg)) + " " + (Math.round(avg * 10) / 10) + " · " + HahaI18n.fill("erc.reviewCount", { n: count });
  }
  function when(value) {
    var formatted = HahaI18n.formatTime(value);
    return formatted ? esc(formatted) : "";
  }
  function reviewRow(r) {
    var edited = r.edited ? " · " + esc(T("agent.edited")) : "";
    var parts = [];
    if (r.raterName) parts.push(r.raterName);
    if (r.raterAi) parts.push(r.raterAi);
    var raterText = parts.length ? parts.join(" · ") : (r.rater || "");
    return '<div class="review"><div class="stars">' + stars(r.stars) + '</div><div class="review-text">' + esc(r.review) + '</div><div class="review-rater">' + esc(raterText) + '</div>' + (r.ratedAt ? '<div class="review-time">' + when(r.ratedAt) + edited + '</div>' : "") + '</div>';
  }
  /* 把 EVM 地址换成它的 .ai（有 .ai 时），无 .ai 时照常显示 EVM 地址。 */
  async function displayName(address) {
    if (!address) return "";
    if (window.HahaRPC && typeof HahaRPC.aiName === "function") {
      try { var ai = await Promise.resolve(HahaRPC.aiName(address)); if (ai) return ai; } catch (err) {}
    }
    return address;
  }

  // ?name= 取名字，默认 moon.haha 仅作输入缺省，不把它当成已铸造事实。
  var raw = new URLSearchParams(location.search).get("name") || "moon.haha";
  var parts = raw.split(".");
  var label = (parts[0] || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  var tld = (parts[1] === "meme") ? "meme" : "haha";
  var name = label + "." + tld;
  var root = document.getElementById("root");

  function notFound(msg) {
    root.innerHTML = '<h1>' + esc(T("agent.missing")) + '</h1><p class="lede">' + esc(msg) + '</p>';
  }

  /* 从评价文本库随机取一条当默认评语（避免连续两次相同）。
   * 库未加载时返回空串，评价框留空、用户自己写。 */
  var lastReview = "";
  function randomReview() {
    var lib = window.HAHA_REVIEW_LIBRARY;
    if (!lib || !lib.length) return "";
    var pick = lib[Math.floor(Math.random() * lib.length)];
    if (lib.length > 1) {
      var guard = 0;
      while (pick === lastReview && guard < 10) {
        pick = lib[Math.floor(Math.random() * lib.length)];
        guard++;
      }
    }
    lastReview = pick;
    return pick;
  }

  // 历代：HahaIndex.generations(fullName)。代数从大到小、当前代在前，评语按 ratedAt 倒序；
  // 从未铸出返回 null，铸出过但无 agent 时 generations 为 []。没有数据时显示空状态。
  async function loadGenerations(generation) {
    var genBox = document.getElementById("generations");
    var revBox = document.getElementById("agent-reviews");
    if (!genBox && !revBox) return;
    if (!window.HahaIndex || typeof HahaIndex.generations !== "function") {
      if (genBox) genBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      if (revBox) revBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      return;
    }
    var res;
    try { res = await Promise.resolve(HahaIndex.generations(name)); } catch (err) {
      if (genBox) genBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      if (revBox) revBox.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      return;
    }
    if (!res || !res.generations || !res.generations.length) {
      if (genBox) genBox.innerHTML = "<p>" + esc(T("agent.noGen")) + "</p>";
      if (revBox) revBox.innerHTML = "<p>" + esc(T("agent.noRev")) + "</p>";
      return;
    }
    var gens = res.generations;
    if (revBox) {
      var current = gens.filter(function (g) { return g.active; })[0] || gens.filter(function (g) { return Number(g.generation) === Number(generation); })[0] || gens[0];
      var reviews = current.reviews || [];
      revBox.innerHTML = reviews.length
        ? reviews.map(reviewRow).join("")
        : "<p>" + esc(T("agent.noRev")) + "</p>";
    }
    if (genBox) {
      var owners = await Promise.all(gens.map(function (gen) { return displayName(gen.owner); }));
      genBox.innerHTML = gens.map(function (gen, i) {
        var reviews = (gen.reviews || []).map(reviewRow).join("");
        return '<article class="card"><h3>' + esc(HahaI18n.fill("erc.genN", { n: gen.generation })) + (gen.active ? " · " + esc(T("erc.current")) : " · " + esc(T("agent.transferBurn"))) + '</h3>'
          + '<p>' + scoreText(gen.starsCount, gen.starsSum) + '</p>'
          + '<p>agentId ' + esc(gen.agentId) + ' · ' + esc(T("agent.holder")) + esc(owners[i]) + '</p>'
          + (gen.agentURI ? '<p>agentURI：' + uriLink(gen.agentURI) + '</p>' : '')
          + (gen.activatedAt ? '<p>' + esc(T("agent.activated")) + when(gen.activatedAt) + '</p>' : '')
          + (gen.resetAt ? '<p>' + esc(T("agent.ended")) + when(gen.resetAt) + '</p>' : '')
          + (reviews || "<p>" + esc(T("agent.noRev")) + "</p>")
          + (gen.reviewsTruncated ? "<p>" + esc(T("erc.truncated")) + "</p>" : "")
          + '</article>';
      }).join("");
    }
  }

  /* 验证记录：GET /v1/agents/{agentId}/validations。验证者有 .ai 显示 .ai，
   * 无 .ai 显示“管理员验证”（v1 验证者恒为管理员）。 */
  async function loadValidations(agentId) {
    var box = document.getElementById("validations");
    if (!box) return;
    var base = (window.HAHA_INDEXER_BASE || "/api").replace(/\/$/, "");
    var data = null;
    try {
      var res = await fetch(base + "/v1/agents/" + encodeURIComponent(String(agentId)) + "/validations", { headers: { "accept": "application/json" } });
      if (!res.ok) throw new Error("http " + res.status);
      data = await res.json();
    } catch (err) {
      box.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
      return;
    }
    var list = (data && data.validations) || [];
    if (!list.length) {
      box.innerHTML = "<p>" + esc(T("agent.noValidations")) + "</p>";
      return;
    }
    var disputeKey = { not_disputed: "agent.disputeNotDisputed", disputed: "agent.disputeDisputed", upheld: "agent.disputeUpheld", overturned: "agent.disputeOverturned" };
    var rows = await Promise.all(list.map(async function (v) {
      var tagText = "";
      if (v.tag === "identity-verified") tagText = T("agent.validationTagIdentity");
      else if (v.tag === "endpoint-reachable") tagText = T("agent.validationTagEndpoint");
      else if (v.tag) tagText = v.tag;
      var dKey = disputeKey[v.disputeStatus] || "agent.disputeNotDisputed";
      var validatorName = T("agent.validationAdmin");
      if (v.validatorAddress) {
        var dn = await displayName(v.validatorAddress);
        if (dn && dn.toLowerCase() !== String(v.validatorAddress).toLowerCase()) validatorName = dn;
      }
      var scoreHtml = (v.response == null) ? esc(T("agent.validationPending")) : esc(String(v.response)) + " / 100";
      var evHtml = v.responseURI ? '<p>' + esc(T("agent.validationEvidence")) + '：' + uriLink(v.responseURI) + '</p>' : "";
      /* 证据链：请求文档 → 请求哈希 → 验证请求交易 → 验证者回执交易，
       * 全部取自 /v1/agents/{agentId}/validations 的同一条记录。 */
      var chainHtml = '<div><b>' + esc(T("agent.evidenceTitle")) + '</b></div>'
        + (v.requestURI ? '<div>' + esc(T("agent.evidenceDoc")) + '：' + uriLink(v.requestURI) + '</div>' : "")
        + (v.requestHash ? '<div>' + esc(T("agent.evidenceReqHash")) + '：<span title="' + esc(v.requestHash) + '">' + esc(shortHash(v.requestHash)) + '</span></div>' : "")
        + (v.requestTxHash ? '<div>' + esc(T("agent.evidenceReqTx")) + '：' + txLink(v.requestTxHash) + '</div>' : "")
        + (v.lastUpdateTxHash ? '<div>' + esc(T("agent.evidenceRespTx")) + '：' + txLink(v.lastUpdateTxHash) + '</div>' : "");
      var timeHtml = v.lastUpdatedAt ? '<p>' + esc(T("agent.validationTime")) + '：' + when(v.lastUpdatedAt) + '</p>' : "";
      var head = tagText ? '<div><b>' + esc(tagText) + '</b> · ' + scoreHtml + '</div>' : '<div>' + scoreHtml + '</div>';
      return '<div class="validation">' + head
        + '<div>' + esc(T("agent.validationValidator")) + '：' + esc(validatorName) + '</div>'
        + timeHtml + evHtml + chainHtml
        + '<div>' + esc(T(dKey)) + '</div></div>';
    }));
    box.innerHTML = rows.join("");
  }

  var cached = null;
  async function load() {
    if (!window.HahaRPC) { notFound(T("agent.chain")); return; }
    var tokenId, owner, agentId, agent, score;
    try {
      if (cached) {
        tokenId = cached.tokenId; owner = cached.owner; agentId = cached.agentId; agent = cached.agent; score = cached.score;
      } else {
        tokenId = HahaRPC.tokenIdOf ? HahaRPC.tokenIdOf(label, tld) : await Promise.resolve(HahaRPC.nodeOf(label, tld));
        if (!tokenId) { notFound(T("agent.notFound")); return; }
        var first = await Promise.all([HahaRPC.ownerOf(tokenId), HahaRPC.agentOfName(tokenId)]);
        owner = first[0];
        agentId = first[1];
        if (isZero(owner) || !agentId || String(agentId) === "0") { notFound(T("agent.notFound")); return; }
        var second = await Promise.all([HahaRPC.getAgent(agentId), HahaRPC.getScore(agentId)]);
        agent = second[0];
        score = second[1];
        if (!agent || !agent.active) { notFound(T("agent.notFound")); return; }
        cached = { tokenId: tokenId, owner: owner, agentId: agentId, agent: agent, score: score };
      }
    } catch (err) { notFound(T("agent.chain")); return; }

    var generation = agent.generation != null ? agent.generation : "";
    var holderText = await displayName(owner);
    var uri = agent.uri || "";
    var uriHtml = uri ? '<p>agentURI：' + uriLink(uri) + '</p>' : "";
    var regUrl = registrationUrl(name);
    var regHtml = '<p>' + esc(T("agent.registrationFile")) + '：<a href="' + esc(regUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(regUrl) + '</a> <button class="btn light" type="button" id="copy-reg-url">' + esc(T("agent.copyRegistrationUrl")) + '</button></p>'
      + '<p>' + esc(T("agent.registrationNote")) + '</p>';
    /* 更新按钮 fail-closed：只有取到登录 .ai 对应地址、且与持有人地址相同才显示；取不到任一地址时隐藏。 */
    var session = window.HahaSession ? HahaSession.get() : null;
    var myAddr = session && session.address ? String(session.address).toLowerCase() : "";
    var isHolder = !!myAddr && !!owner && myAddr === String(owner).toLowerCase();
    /* operator 身份链上查（fail-closed）：读不到就当不是。 */
    var isOperator = false;
    if (myAddr && window.HahaRPC && typeof HahaRPC.isAgentOperator === "function") {
      try { isOperator = await Promise.resolve(HahaRPC.isAgentOperator(agentId, myAddr)); } catch (err) { isOperator = false; }
    }
    var opCount = null;
    if (window.HahaRPC && typeof HahaRPC.operatorCount === "function") {
      try { opCount = await Promise.resolve(HahaRPC.operatorCount(agentId)); } catch (err) { opCount = null; }
    }
    var canManageUri = isHolder || isOperator;
    var updateLabel = esc(T("agent.updateToStandardUri")) + (HahaI18n.lang() === "en" ? " (" + esc(T("agent.updateOnlyHolder")) + ")" : "（" + esc(T("agent.updateOnlyHolder")) + "）");
    var updateHtml = isHolder ? '<p><button class="btn" type="button" id="update-std-uri">' + updateLabel + '</button></p>' : "";
    /* 请求验证按钮 fail-closed：只有持有人才显示；取不到地址时隐藏。 */
    var requestValidationHtml = isHolder ? '<p><button class="btn" type="button" id="request-validation">' + esc(T("agent.requestValidation")) + '</button></p>' : "";
    var validationHtml = '<h2>' + esc(T("agent.validation")) + '</h2>'
      + '<p>' + esc(T("agent.validationNote")) + '</p>'
      + '<div class="list" id="validations"><p>' + esc(T("common.loading")) + '</p></div>'
      + requestValidationHtml;
    /* 管理区：改 URI（主人或 operator），设 operator（仅主人）。别人看不到。 */
    var manageHtml = "";
    if (canManageUri || isHolder) {
      manageHtml = '<h2>' + esc(T("agent.manageTitle")) + '</h2>'
        + '<p>' + esc(T("agent.manageNote")) + '</p>';
      if (canManageUri) {
        manageHtml += '<label class="manage-field">' + esc(T("agent.setUriLabel")) + ' <input id="new-uri" class="field-input" maxlength="2048" placeholder="' + esc(T("agent.setUriPh")) + '" autocomplete="off" spellcheck="false"></label>'
          + '<p><button class="btn" type="button" id="copy-set-uri" disabled>' + esc(T("agent.setUriCopy")) + '</button></p>'
          + '<p class="note" id="set-uri-msg"></p>';
      }
      if (isHolder) {
        manageHtml += '<h3>' + esc(T("agent.operatorTitle")) + '</h3>'
          + (opCount == null ? "" : '<p>' + esc(HahaI18n.fill("agent.operatorCount", { x: opCount })) + '</p>')
          + '<label class="manage-field">' + esc(T("agent.operatorLabel")) + ' <input id="op-addr" class="field-input" placeholder="0x…" autocomplete="off" spellcheck="false"></label>'
          + '<p class="manage-btns"><button class="btn" type="button" id="op-add" disabled>' + esc(T("agent.operatorAdd")) + '</button> <button class="btn light" type="button" id="op-remove" disabled>' + esc(T("agent.operatorRemove")) + '</button> <button class="btn light" type="button" id="op-check">' + esc(T("agent.operatorCheck")) + '</button></p>'
          + '<p class="note" id="op-msg"></p>';
      }
    }
    var nft = (typeof hahaNft === "function") ? hahaNft(name) : "";
    var commentValue = "";
    var oldComment = document.getElementById("comment");
    var hadComment = !!oldComment;
    if (oldComment) commentValue = oldComment.value;
    root.innerHTML = '<p class="kicker">' + esc(T("agent.kicker")) + '</p><div class="two">'
      + '<div class="panel"><div class="nft" style="max-width:280px">' + nft + '</div><h2>' + esc(name) + '</h2><p>' + esc(T("agent.active")) + '</p><p>' + esc(T("agent.holder")) + esc(holderText) + '</p><p>' + esc(HahaI18n.fill("agent.gen", { n: generation })) + '</p><p class="stars">' + scoreText(score && score.count, score && score.sum) + '</p>' + uriHtml + regHtml + updateHtml + validationHtml + manageHtml + '<p><a class="btn light" href="/erc8004.html">' + esc(T("agent.back")) + '</a></p></div>'
      + '<div class="panel"><h2>' + esc(T("agent.write")) + '</h2><p>' + esc(T("agent.writeHelp")) + '</p>'
      + '<form id="rate" class="list"><label>' + esc(T("agent.stars")) + ' <select id="stars" class="field-input"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>'
      + '<textarea id="comment" class="field-input" maxlength="140" placeholder="' + esc(T("agent.commentPh")) + '" rows="3"></textarea>'
      + '<div><button class="btn light" type="button" id="random-review">' + esc(T("agent.randomReview")) + '</button></div>'
      + '<button class="btn" type="submit">' + esc(T("agent.copy")) + '</button></form>'
      + '<h2>' + esc(T("agent.reviews")) + '</h2><div class="list" id="agent-reviews"><p>' + esc(T("agent.loadingRev")) + '</p></div>'
      + '<h2>' + esc(T("agent.gens")) + '</h2><p>' + esc(HahaI18n.fill("agent.genHelp", { n: generation })) + '</p><p>' + esc(T("agent.transferBurnNote")) + '</p><p>' + esc(T("agent.oldFromIndex")) + '</p><div class="list" id="generations"><p>' + esc(T("agent.loadingGen")) + '</p></div>'
      + '</div></div>';
    var commentEl = document.getElementById("comment");
    if (commentValue) commentEl.value = commentValue;
    else if (!hadComment) commentEl.value = randomReview();
    var randomBtn = document.getElementById("random-review");
    if (randomBtn) randomBtn.addEventListener("click", function () {
      var el = document.getElementById("comment");
      if (el) el.value = randomReview();
    });

    document.getElementById("rate").addEventListener("submit", function (e) {
      e.preventDefault();
      var text = document.getElementById("comment").value.replace(/\r?\n/g, " ").replace(/"/g, "”").trim() || T("agent.defaultComment");
      if (new TextEncoder().encode(text).length > 140) { HahaUI.toast(T("toast.reviewLong")); return; }
      var n = document.getElementById("stars").value;
      HahaUI.copyText(hahaInstruction(HahaI18n.task("rate", { name: name, stars: n, text: text }))).then(function (ok) {
        if (ok === false) return;
        HahaUI.toast(T("toast.rateCopied"));
      });
    });

    var copyRegBtn = document.getElementById("copy-reg-url");
    if (copyRegBtn) copyRegBtn.addEventListener("click", function () {
      HahaUI.copyText(regUrl).then(function (ok) {
        if (ok === false) return;
        HahaUI.toast(T("toast.copied"));
      });
    });
    var updateBtn = document.getElementById("update-std-uri");
    if (updateBtn) updateBtn.addEventListener("click", function () {
      /* 点击时再核对一次持有人身份（fail-closed）：不是持有人就不复制。 */
      var s = window.HahaSession ? HahaSession.get() : null;
      var mine = s && s.address ? String(s.address).toLowerCase() : "";
      if (!mine || mine !== String(owner).toLowerCase()) return;
      HahaUI.copyText(hahaInstruction(HahaI18n.task("setStandardUri", { name: name, agentId: String(agentId), registrationUrl: regUrl }))).then(function (ok) {
        if (ok === false) return;
        HahaUI.toast(T("toast.instruction"));
      });
    });
    var reqValBtn = document.getElementById("request-validation");
    if (reqValBtn) reqValBtn.addEventListener("click", function () {
      /* 点击时再核对一次持有人身份（fail-closed）：不是持有人就不复制。 */
      var s2 = window.HahaSession ? HahaSession.get() : null;
      var mine2 = s2 && s2.address ? String(s2.address).toLowerCase() : "";
      if (!mine2 || mine2 !== String(owner).toLowerCase()) return;
      HahaUI.copyText(hahaInstruction(HahaI18n.task("validationRequest", { name: name, agentId: String(agentId) }))).then(function (ok) {
        if (ok === false) return;
        HahaUI.toast(T("toast.instruction"));
      });
    });

    /* 改 URI：1–2048 字节才可点；空或超长点不下去。 */
    var uriInput = document.getElementById("new-uri");
    var uriBtn = document.getElementById("copy-set-uri");
    var uriMsg = document.getElementById("set-uri-msg");
    function uriBytes(v) { try { return new TextEncoder().encode(v).length; } catch (err) { return v.length; } }
    if (uriInput && uriBtn) {
      uriInput.addEventListener("input", function () {
        var n = uriBytes(uriInput.value.trim());
        var ok = n >= 1 && n <= 2048;
        uriBtn.disabled = !ok;
        if (uriMsg) uriMsg.textContent = (!ok && uriInput.value) ? T("agent.setUriInvalid") : "";
      });
      uriBtn.addEventListener("click", function () {
        var v = uriInput.value.trim();
        var n = uriBytes(v);
        if (n < 1 || n > 2048) { if (uriMsg) uriMsg.textContent = T("agent.setUriInvalid"); return; }
        var s = window.HahaSession ? HahaSession.get() : null;
        var mine = s && s.address ? String(s.address).toLowerCase() : "";
        if (!mine || mine !== myAddr) return;
        HahaUI.copyText(hahaInstruction(HahaI18n.task("setAgentURI", { name: name, agentId: String(agentId), newUri: v }))).then(function (ok) {
          if (ok === false) return;
          HahaUI.toast(T("toast.instruction"));
        });
      });
    }
    /* 设 operator：仅主人；非法地址（非 0x 地址、零地址、本人）点不下去；满 8 个不能加。 */
    var opInput = document.getElementById("op-addr");
    var opAdd = document.getElementById("op-add");
    var opRemove = document.getElementById("op-remove");
    var opCheck = document.getElementById("op-check");
    var opMsg = document.getElementById("op-msg");
    function opValid(v) {
      if (!/^0x[0-9a-fA-F]{40}$/.test(v) || isZero(v)) return "invalid";
      if (v.toLowerCase() === String(owner).toLowerCase()) return "self";
      return "";
    }
    if (opInput && opAdd && opRemove) {
      opInput.addEventListener("input", function () {
        var bad = opValid(opInput.value.trim());
        var full = opCount != null && Number(opCount) >= 8;
        opAdd.disabled = !!bad || full;
        opRemove.disabled = !!bad;
        if (opMsg) opMsg.textContent = bad === "self" ? T("agent.operatorSelf") : bad === "invalid" ? (opInput.value ? T("agent.operatorInvalid") : "") : full ? T("agent.operatorFull") : "";
      });
      if (opCheck) opCheck.addEventListener("click", function () {
        var v = opInput.value.trim();
        var bad = opValid(v);
        if (bad) { if (opMsg) opMsg.textContent = T(bad === "self" ? "agent.operatorSelf" : "agent.operatorInvalid"); return; }
        if (!window.HahaRPC || !HahaRPC.isAgentOperator) return;
        HahaRPC.isAgentOperator(agentId, v).then(function (yes) {
          if (opMsg) opMsg.textContent = T(yes ? "agent.operatorIsYes" : "agent.operatorIsNo");
        }).catch(function () {});
      });
      function opCopy(allowed) {
        var v = opInput.value.trim();
        if (opValid(v)) return;
        if (allowed && opCount != null && Number(opCount) >= 8) { if (opMsg) opMsg.textContent = T("agent.operatorFull"); return; }
        var s2 = window.HahaSession ? HahaSession.get() : null;
        var mine2 = s2 && s2.address ? String(s2.address).toLowerCase() : "";
        if (!mine2 || mine2 !== String(owner).toLowerCase()) return;
        HahaUI.copyText(hahaInstruction(HahaI18n.task("setAgentOperator", { name: name, agentId: String(agentId), operator: v, allowed: allowed ? "true" : "false" }))).then(function (ok) {
          if (ok === false) return;
          HahaUI.toast(T("toast.instruction"));
        });
      }
      opAdd.addEventListener("click", function () { opCopy(true); });
      opRemove.addEventListener("click", function () { opCopy(false); });
    }

    loadGenerations(generation);
    loadValidations(agentId);
  }
  if (window.HahaI18n) HahaI18n.onChange(function () { load(); });
  if (window.HahaSession) HahaSession.onChange(function () { load(); });
  load();
})();
</script>

<script src="/js/rain.js?v=7"></script>
</body>
