<script>
(function () {
  function T(key) { return HahaI18n.t(key); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
  function timeStr(iso) {
    return HahaI18n.formatTime(iso);
  }
  function card(title, num, sub) {
    var h = '<article class="board-card"><h3>' + esc(title) + '</h3>';
    h += '<div class="num">' + esc(num) + '</div>';
    if (sub) h += '<div class="sub">' + esc(sub) + '</div>';
    return h + '</article>';
  }
  function splitCard(title, aLabel, aNum, bLabel, bNum, sub) {
    var h = '<article class="board-card"><h3>' + esc(title) + '</h3>';
    h += '<div class="split"><span>' + esc(aLabel) + '</span><b>' + esc(aNum) + '</b></div>';
    h += '<div class="split"><span>' + esc(bLabel) + '</span><b>' + esc(bNum) + '</b></div>';
    if (sub) h += '<div class="sub">' + esc(sub) + '</div>';
    return h + '</article>';
  }
  function renderStats(st) {
    var board = document.getElementById("board");
    if (board) {
      board.innerHTML =
        card(T("stats.participants"), fmt(st.participants), T("stats.participantsNote")) +
        card(T("stats.activeAgents"), fmt(st.activeAgents),
          HahaI18n.fill("stats.totalActivations", { n: fmt(st.totalActivations) })) +
        card(T("stats.registeredHaha"), fmt(st.registered.haha),
          HahaI18n.fill("stats.registeredTotal", { n: fmt(st.registered.total) })) +
        card(T("stats.registeredMeme"), fmt(st.registered.meme),
          HahaI18n.fill("stats.registeredTotal", { n: fmt(st.registered.total) }));
    }
    var short = document.getElementById("short-board");
    if (short) {
      short.innerHTML =
        splitCard(T("stats.threeDigit"), T("stats.hahaLeft"), fmt(st.threeDigit.haha.remaining),
          T("stats.memeLeft"), fmt(st.threeDigit.meme.remaining),
          T("stats.threeDigitNote") + " · " + HahaI18n.fill("stats.mintedBoth", { a: fmt(st.threeDigit.haha.minted), b: fmt(st.threeDigit.meme.minted) })) +
        splitCard(T("stats.threeLetter"), T("stats.hahaLeft"), fmt(st.threeLetter.haha.remaining),
          T("stats.memeLeft"), fmt(st.threeLetter.meme.remaining),
          T("stats.threeLetterNote") + " · " + HahaI18n.fill("stats.mintedBoth", { a: fmt(st.threeLetter.haha.minted), b: fmt(st.threeLetter.meme.minted) }));
    }
    var note = document.getElementById("source-note");
    if (note) {
      if (st.safeBlock != null) {
        note.hidden = false;
        note.textContent = HahaI18n.fill("stats.source", { block: fmt(st.safeBlock) });
      } else {
        note.hidden = true;
      }
    }
  }
  function renderLatest(items) {
    var track = document.getElementById("ticker-track");
    if (!track) return;
    if (!items || !items.length) {
      track.className = "ticker-track";
      track.style.animationDuration = "";
      track.innerHTML = "<p>" + esc(T("stats.latestEmpty")) + "</p>";
      return;
    }
    var rows = items.map(function (it) {
      return '<div class="row"><b>' + esc(it.fullName) + '</b><span>' + esc(timeStr(it.mintedAt)) + '</span></div>';
    }).join("");
    if (items.length >= 4) {
      track.className = "ticker-track animate";
      track.style.animationDuration = (items.length * 2) + "s";
      track.innerHTML = rows + rows;
    } else {
      track.className = "ticker-track";
      track.style.animationDuration = "";
      track.innerHTML = rows;
    }
  }
  function fail() {
    var board = document.getElementById("board");
    if (board) board.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
    var short = document.getElementById("short-board");
    if (short) short.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>";
    var track = document.getElementById("ticker-track");
    if (track) { track.className = "ticker-track"; track.innerHTML = "<p>" + esc(T("common.chainFail")) + "</p>"; }
  }
  function load() {
    if (!window.HahaIndex || typeof window.HahaIndex.stats !== "function") { fail(); return; }
    window.HahaIndex.stats().then(function (st) {
      if (!st) { fail(); return; }
      renderStats(st);
      renderLatest(st.latest || []);
    }, fail);
  }
  window.hahaOnSession = load;
  if (window.HahaI18n) HahaI18n.onChange(load);
  load();
  setInterval(load, 30000);
})();
</script>
